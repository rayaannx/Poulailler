<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Poulailler - Accueil</title><link rel="stylesheet" href="css/style.css"></head><body><header class="topbar"><h1>🐥 Poulailler</h1><div class="top-actions"><button id="themeBtn" class="icon-btn">🌙</button><button id="logout" class="danger small">Déconnexion</button></div></header><main class="container"><section class="welcome"><h2>Mes séries</h2><p class="muted">Connecté : <span id="userEmail"></span></p></section><section id="alertBox" class="alert hidden"></section><section class="stats"><div class="stat card"><span>Séries</span><strong id="seriesCount">0</strong></div><div class="stat card"><span>🐥 Vivants</span><strong id="liveCount">0</strong></div><div class="stat card"><span>💀 Morts</span><strong id="deadCount">0</strong></div><div class="stat card"><span>🌾 Aliment</span><strong id="feedCount">0 kg</strong></div></section><section class="card"><h2>Ajouter une série</h2><form id="seriesForm" class="grid-form"><div><label>Numéro</label><input id="number" required></div><div><label>Date d'entrée</label><input id="entryDate" type="date" required></div><div><label>Nombre de poussins</label><input id="initialBirds" type="number" min="1" required></div><div><button class="primary" type="submit">+ Ajouter</button></div></form><p id="message" class="message"></p></section><section><h2>Mes séries</h2><div id="seriesList" class="series-grid"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/theme.js"></script><script src="js/app.js"></script></body></html>
